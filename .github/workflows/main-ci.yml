# Name the Workflow/Pipeline, this appears on the Github Actions page, so keep it easy to understand and recognisable.
name: main-continous-integration

# Setup the triggers for the pipeline, this the event that occurs that trigger this pipeline to run.
# Trigger the CI pipeline on push or pull request (main branch)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Declare environment variables for use throughout the pipeline
env:
  DotNetVersion: 10.x
  Solution: todo-momo-api/todo-momo-api.slnx

# Setup the job steps. This defines the steps that the pipeline will follow
jobs:
  build:
    # Specify the server/agent that the pipeline will run on
    runs-on: ubuntu-latest

    # Configure the steps for the pipeline
    steps:
      # Check the latest code out of the repo
      - name: Checkout
        uses: actions/checkout@v6

      # Setup the DotNet environment on the agent
      - name: Setup DotNet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DotNetVersion }}

      # Restore the dependencies for the project
      - name: Restore Dependencies
        run: dotnet restore ${{ env.Solution }}

      # Build the solution
      - name: Build
        run: dotnet build ${{ env.Solution }} --configuration Release --no-restore

      # Run the tests and get the code coverage
      - name: Test
        run: dotnet test --solution ${{ env.Solution }} --configuration Release --no-build --verbosity normal --coverage --coverage-output-format cobertura --results-directory ./coverage

      - name: Produce the coverage report
        uses: insightsengineering/coverage-action@v3
        with:
          # Path to the Cobertura XML report.
          path: coverage/**.cobertura.xml
          # Minimum total coverage, if you want to the
          # workflow to enforce it as a standard.
          # This has no effect if the `fail` arg is set to `false`.
          threshold: 80.123
          # Fail the workflow if the minimum code coverage
          # reuqirements are not satisfied.
          fail: true
          # Publish the rendered output as a PR comment
          publish: true
          # Create a coverage diff report.
          diff: true
          # Branch to diff against.
          # Compare the current coverage to the coverage
          # determined on this branch.
          diff-branch: main
          # This is where the coverage reports for the
          # `diff-branch` are stored.
          # Branch is created if it doesn't already exist'.
          diff-storage: _xml_coverage_reports
          # A custom title that can be added to the code
          # coverage summary in the PR comment.
          coverage-summary-title: "Code Coverage Summary"
          # Failure modes for coverage regression detection:
          # Fail if any changed file has more uncovered lines (pycobertura exit code 2)
          uncovered-statements-increase-failure: false
          # Fail if new uncovered statements are introduced despite overall improvement (pycobertura exit code 3)
          new-uncovered-statements-failure: false
          # Fail if the overall coverage percentage decreases (more forgiving approach)
          coverage-rate-reduction-failure: true

      # Create the code coverage report
      #- name: Code Coverage Report
      #  uses: irongut/CodeCoverageSummary@v1.3.0
